services:
  bridge:
    build:
      context: .
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: 8765
      CODEX_BIN: /usr/local/bin/codex
      CODEX_HOME: /home/node/.codex
      BRIDGE_SETUP_DIR: /setup
    ports:
      - "${BRIDGE_BIND_ADDRESS:-127.0.0.1}:${BRIDGE_PUBLISHED_PORT:-8765}:8765"
    volumes:
      - codex-home:/home/node/.codex
      - .:/setup
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 20s
      start_period: 10s
      retries: 3
volumes:
  codex-home:
